<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>24 HORAS — Jogo</title>
<style>
:root{--bg:#171816;--paper:#f4f0e8;--card:#fffdf8;--ink:#22231f;--muted:#77746c;--line:#ded8ca;--accent:#596b58;--gold:#b38b45;--danger:#a6534c;--blue:#61778c}
*{box-sizing:border-box}body{margin:0;background:#10110f;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink)}button{font:inherit}.game{width:min(430px,100vw);min-height:100vh;margin:auto;background:var(--paper);position:relative;overflow:hidden}.top{height:58px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.logo{font-size:12px;font-weight:950;letter-spacing:2px}.status{display:flex;gap:8px;align-items:center}.day{font-size:10px;font-weight:900}.pill{background:#e7e0d4;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:900}.progress{height:4px;background:#ddd7ca}.progress i{height:100%;display:block;background:var(--ink);transition:.4s}.screen{min-height:calc(100vh - 62px);padding:16px 16px 100px}.hidden{display:none!important}.eyebrow{font-size:9px;letter-spacing:1.8px;font-weight:950;color:var(--muted);text-transform:uppercase}.h1{font-size:31px;line-height:1.02;letter-spacing:-1.3px;font-weight:950;margin:7px 0 10px}.sub{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 15px}.btn{width:100%;border:0;background:var(--ink);color:#fff;padding:14px 15px;border-radius:14px;font-weight:900;font-size:11px;cursor:pointer;margin-top:9px}.btn.light{background:#e6dfd2;color:var(--ink)}.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}.hero{background:var(--ink);color:#fff;border-radius:25px;padding:22px;min-height:210px;position:relative;overflow:hidden}.hero:after{content:'24';position:absolute;right:-12px;bottom:-35px;font-size:150px;font-weight:950;opacity:.07}.hero h1{font-size:38px;max-width:290px;margin-top:10px}.hero p{color:#c9c5bb}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}.chip{background:#373833;color:#eee9de;padding:7px 9px;border-radius:99px;font-size:8px;font-weight:900}.scene{background:#ded8cb;border-radius:22px;min-height:250px;margin:12px 0;padding:14px;position:relative;overflow:hidden}.room{background:#f5f0e6;border:1px solid #cbc4b6;border-radius:18px;position:absolute}.room.r1{left:10px;top:10px;width:46%;height:48%}.room.r2{right:10px;top:10px;width:46%;height:48%}.room.r3{left:10px;bottom:10px;width:30%;height:42%}.room.r4{left:35%;bottom:10px;width:30%;height:42%}.room.r5{right:10px;bottom:10px;width:30%;height:42%}.room span{position:absolute;left:9px;top:8px;font-size:8px;color:#8a8378;font-weight:900}.personMap{position:absolute;z-index:3;background:#fffdf8;border:2px solid var(--ink);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:23px;box-shadow:0 4px 0 #0001;transition:.3s}.pm1{left:24%;top:25%}.pm2{left:65%;top:29%}.pm3{left:18%;bottom:20%}.pm4{right:16%;bottom:20%}.sceneHint{position:absolute;bottom:8px;left:12px;right:12px;text-align:center;font-size:8px;color:#746f65}.cards{display:grid;gap:9px}.choice{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer;transition:.12s}.choice:active{transform:scale(.98)}.choice b{font-size:11px}.choice small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:5px}.choice.selected{border:2px solid var(--ink);background:#f7f2e8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px}.stat small{font-size:7px;color:var(--muted);font-weight:900}.stat b{display:block;font-size:17px;margin-top:3px}.money{color:var(--accent)}.time{color:var(--blue)}.mood{color:var(--gold)}.meter{height:7px;background:#e1dbcf;border-radius:99px;overflow:hidden;margin-top:6px}.meter i{height:100%;display:block;border-radius:99px;background:var(--ink);transition:.35s}.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;align-items:center;gap:10px}.task .icon{width:35px;height:35px;border-radius:11px;background:#ebe4d8;display:grid;place-items:center;font-size:17px;flex:none}.task b{font-size:10px}.task small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.task button{margin-left:auto;border:0;background:#e8e1d5;border-radius:10px;padding:8px;font-size:8px;font-weight:950}.task.done{opacity:.55}.section{margin:17px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.sectionHead h3{font-size:12px;margin:0}.sectionHead small{font-size:8px;color:var(--muted)}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px}.avatar{font-size:27px}.person b{display:block;font-size:11px;margin-top:4px}.person small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.tag{display:inline-block;margin-top:7px;background:#e9e3d8;border-radius:99px;padding:5px 7px;font-size:7px;font-weight:900}.budget{background:var(--ink);color:white;border-radius:19px;padding:15px}.budget small{font-size:8px;color:#aaa69c;font-weight:900}.budget strong{display:block;font-size:27px;margin-top:3px}.budget .meter{background:#3c3d38}.budget .meter i{background:#d8d0bf}.service{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.service .icon{font-size:20px}.service b{font-size:10px}.service small{display:block;color:var(--muted);font-size:8px;line-height:1.4;margin-top:3px}.buy{margin-left:auto;border:1px solid var(--line);background:#ebe4d8;border-radius:10px;padding:8px;font-size:8px;font-weight:950}.buy.on{background:var(--ink);color:white}.clock{background:#22231f;color:#fff;border-radius:22px;padding:16px;text-align:center}.clock .big{font-size:40px;font-weight:950;letter-spacing:-2px}.clock small{font-size:8px;color:#bbb6ad}.event{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px}.eventIcon{font-size:30px}.event h2{font-size:18px;margin:5px 0}.event p{font-size:10px;color:var(--muted);line-height:1.5}.timeline{display:flex;gap:5px;margin:12px 0}.daydot{flex:1;height:6px;background:#d9d3c7;border-radius:99px}.daydot.active{background:var(--ink)}.daydot.done{background:#7b8b77}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:end}.sheet{width:min(430px,100vw);margin:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 16px 28px;box-shadow:0 -20px 60px #0004}.sheet h2{font-size:19px;margin:6px 0}.sheet p{font-size:10px;color:var(--muted)}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result{text-align:center}.score{font-size:67px;font-weight:950;letter-spacing:-5px}.resultBox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0;text-align:left}.line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:9px}.line:last-child{border:0}.line span{color:var(--muted)}.note{font-size:8px;color:var(--muted);line-height:1.5;background:#e8e2d6;border-radius:13px;padding:11px;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(390px,90%);background:#22231f;color:#fff;padding:12px 15px;border-radius:13px;font-size:9px;z-index:70;box-shadow:0 10px 35px #0005}
@media(min-width:431px){.game{box-shadow:0 0 70px #0009}}
</style></head>
<body><div class="game"><header class="top"><div class="logo">24 HORAS</div><div class="status"><span id="moneyPill" class="pill">R$ 2.000</span><span id="dayLabel" class="day">INÍCIO</span></div></header><div class="progress"><i id="progress"></i></div><main id="screen" class="screen"></main></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const state={id:'P-'+Date.now()+'-'+Math.floor(Math.random()*99999),group:Math.floor(Math.random()*4)+1,family:null,budget:2000,time:72,mood:70,day:0,action:0,services:[],assign:{},mental:{},events:[],promotion:null,shock:null,reorg:null,profile:{}};
const families=[
{name:'Família Oliveira',people:[['👩🏻','Josefa','36 anos','adult'],['👨🏻','João','34 anos','adult'],['🧒🏻','Júlio','6 anos','child']]},
{name:'Família Santos',people:[['👩🏽','Mariana','39 anos','adult'],['👨🏽','Paulo','41 anos','adult'],['🧒🏽','Lia','10 anos','child'],['🧒🏽','Caio','6 anos','child'],['👶🏽','Bia','2 anos','child']]},
{name:'Família Lima',people:[['👩🏾','Camila','33 anos','adult'],['👩🏾','Renata','35 anos','adult'],['🧒🏾','Davi','7 anos','child']]},
{name:'Família Costa',people:[['👨🏻','Lucas','32 anos','adult'],['👨🏽','Rafael','35 anos','adult'],['🧒🏽','Noah','8 anos','child']]},
{name:'Família Souza',people:[['👩🏻','Ana','38 anos','adult'],['👨🏻','Marcos','40 anos','adult'],['🧒🏻','Lara','9 anos','child'],['🧒🏻','Theo','4 anos','child']]},
{name:'Família Rocha',people:[['👩🏽','Bianca','42 anos','adult'],['👨🏻','André','44 anos','adult'],['👵🏽','Dona Nair','72 anos','dependent']]},
{name:'Família Martins',people:[['👩🏾','Paula','31 anos','adult'],['👨🏾','Diego','33 anos','adult'],['🧑🏾','Rafa','15 anos','teen']]},
{name:'Família Alves',people:[['👩🏻','Carla','37 anos','adult'],['👨🏻','Bruno','39 anos','adult'],['🧒🏻','Malu','5 anos','child'],['👵🏻','Sr. Alfredo','72 anos','dependent']]},
{name:'Família Mendes',people:[['👩🏽','Fernanda','35 anos','adult'],['👩🏽','Patrícia','36 anos','adult']]},
{name:'Família Silva',people:[['👨🏻','Eduardo','43 anos','adult'],['👩🏻','Juliana','41 anos','adult'],['🧑🏻','Nina','14 anos','teen'],['👶🏻','Leo','2 anos','child']]},
{name:'Família Ferreira',people:[['👩🏽','Sofia','34 anos','adult'],['👨🏽','Daniel','36 anos','adult'],['👧🏽','Clara','8 anos','child'],['👵🏽','Dona Rosa','75 anos','dependent']]}
];
const taskDefs=[['kids','👧','Ficar com as crianças',25,1],['house','🧹','Organizar e limpar a casa',16,1],['clothes','👕','Cuidar das roupas',10,1],['meals','🍳','Resolver refeições',12,1],['shopping','🛒','Fazer compras e entregas',8,1],['dependent','🧓','Acompanhar pessoa dependente',12,1]];
const serviceDefs=[['kids','👧','Ficar com as crianças',500,25],['house','🧹','Organizar e limpar a casa',300,16],['clothes','👕','Cuidar das roupas',220,10],['meals','🍳','Resolver refeições',350,12],['shopping','🛒','Fazer compras e entregas',180,8],['dependent','🧓','Acompanhar pessoa dependente',280,12]];
const mentalDefs=['Lembrar compromissos','Organizar compras do mês','Acompanhar reuniões ou escola','Controlar contas e pagamentos','Marcar consultas e resolver imprevistos','Planejar refeições e rotina'];
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function money(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function adults(){return state.family.people.filter(p=>p[3]==='adult')}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.add('hidden'),1700)}
function go(page){state.page=page;render()}
function render(){const p=state.page||'intro';document.getElementById('moneyPill').textContent=money(state.budget);document.getElementById('dayLabel').textContent=p==='intro'?'INÍCIO':`DIA ${Math.min(7,state.day||1)} / 7`;document.getElementById('progress').style.width=(p==='intro'?0:Math.min(100,(state.day/7)*100))+'%';({intro,familySetup,home,services,taskPick,mentalPick,eventDay,promotion,reorg,profile,result}[p])()}
function intro(){document.getElementById('screen').innerHTML=`<div class="hero"><div class="eyebrow">MINI JOGO DE ESTRATÉGIA</div><div class="h1">Uma semana.<br>Mil decisões.</div><p class="sub">Você vai cuidar de dinheiro, tempo e rotina de uma família. Não existe resposta perfeita.</p><div class="chips"><span class="chip">3–5 MIN</span><span class="chip">7 DIAS</span><span class="chip">RECURSOS LIMITADOS</span></div></div><div class="scene"><div class="room r1"><span>SALA</span></div><div class="room r2"><span>COZINHA</span></div><div class="room r3"><span>QUARTO</span></div><div class="room r4"><span>ÁREA</span></div><div class="room r5"><span>ENTRADA</span></div><div class="personMap pm1">👩🏻</div><div class="personMap pm2">👨🏻</div><div class="personMap pm3">🧒🏻</div><div class="sceneHint">Organize a casa antes que a semana termine.</div></div><p class="sub">Você verá situações, escolherá ações e poderá mudar sua estratégia quando algo inesperado acontecer.</p><button class="btn" onclick="startGame()">COMEÇAR →</button><div class="note">A hipótese do estudo não é apresentada nesta etapa. O objetivo é observar as decisões tomadas durante o jogo.</div>`}
function startGame(){const eligible=families.filter(f=>f.people.filter(p=>p[3]==='adult').length>=2);state.family=eligible[Math.floor(Math.random()*eligible.length)];state.timeVisible=state.group>=3;state.day=1;state.budget=2000;state.time=72;state.mood=70;state.services=[];state.assign={};state.mental={};go('familySetup')}
function familySetup(){const f=state.family;document.getElementById('screen').innerHTML=`<div class="eyebrow">SEGUNDA · 07:00</div><div class="h1">Conheça a casa.</div><p class="sub">Esta é a família que você vai ajudar durante os próximos 7 dias.</p><div class="people">${f.people.map(p=>`<div class="person"><div class="avatar">${p[0]}</div><b>${esc(p[1])}</b><small>${esc(p[2])}</small><span class="tag">${p[3]==='adult'?'ADULTO':p[3]==='dependent'?'DEPENDENTE':p[3]==='teen'?'ADOLESCENTE':'CRIANÇA'}</span></div>`).join('')}</div><div class="stats"><div class="stat"><small>DINHEIRO</small><b class="money">${money(state.budget)}</b></div><div class="stat"><small>HORAS LIVRES</small><b class="time">${state.timeVisible?'72h':'—'}</b></div><div class="stat"><small>ENERGIA</small><b class="mood">${state.mood}</b></div></div><button class="btn" onclick="go('home')">ENTRAR NA SEMANA →</button>`}
function meters(){return `<div class="stats"><div class="stat"><small>DINHEIRO</small><b class="money">${money(state.budget)}</b><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.budget/20))}%"></i></div></div><div class="stat"><small>TEMPO</small><b class="time">${state.timeVisible?state.time+'h':'—'}</b><div class="meter"><i style="width:${state.timeVisible?Math.max(0,state.time/72*100):50}%"></i></div></div><div class="stat"><small>BEM-ESTAR</small><b class="mood">${state.mood}</b><div class="meter"><i style="width:${state.mood}%"></i></div></div></div>`}
function home(){document.getElementById('screen').innerHTML=`<div class="eyebrow">DIA ${state.day} · ${state.day===1?'SEGUNDA':state.day===2?'TERÇA':state.day===3?'QUARTA':state.day===4?'QUINTA':state.day===5?'SEXTA':state.day===6?'SÁBADO':'DOMINGO'}</div><div class="h1">O que fazer agora?</div>${meters()}<div class="clock"><small>HORÁRIO DA CASA</small><div class="big">07:30</div><small>MANHÃ</small></div><div class="scene"><div class="room r1"><span>SALA</span></div><div class="room r2"><span>COZINHA</span></div><div class="room r3"><span>QUARTO</span></div><div class="room r4"><span>ÁREA</span></div><div class="room r5"><span>ENTRADA</span></div><div class="personMap pm1">${state.family.people[0][0]}</div><div class="personMap pm2">${state.family.people[1][0]}</div><div class="personMap pm3">${state.family.people.find(p=>p[3]==='child')?.[0]||'🧓'}</div><div class="sceneHint">Escolha a próxima ação da família.</div></div><div class="section"><div class="sectionHead"><h3>DECISÕES DISPONÍVEIS</h3><small>Escolha 1</small></div><div class="cards"><div class="choice" onclick="go('services')"><b>🛒 Resolver recursos</b><small>Comprar serviços para liberar tempo.</small></div><div class="choice" onclick="go('taskPick')"><b>🧹 Organizar tarefas</b><small>Decidir quem assume cada parte da rotina.</small></div><div class="choice" onclick="advanceDay()"><b>▶️ Seguir o dia</b><small>Não fazer nenhuma mudança e avançar.</small></div></div></div>`}
function services(){document.getElementById('screen').innerHTML=`<div class="eyebrow">LOJA DE TEMPO · DIA ${state.day}</div><div class="h1">Compre tempo.</div><p class="sub">Dinheiro pode aliviar a rotina. Escolha com cuidado: o orçamento é da família.</p><div class="budget"><small>ORÇAMENTO DISPONÍVEL</small><strong>${money(state.budget)}</strong><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.budget/20))}%"></i></div></div><div class="section">${serviceDefs.map(s=>`<div class="service"><div class="icon">${s[1]}</div><div><b>${s[2]}</b><small>R$ ${s[3]} · libera ${s[4]}h</small></div><button class="buy ${state.services.includes(s[0])?'on':''}" onclick="toggleService('${s[0]}',${s[3]})">${state.services.includes(s[0])?'ATIVO':'COMPRAR'}</button></div>`).join('')}</div><button class="btn" onclick="go('home')">VOLTAR PARA A CASA</button>`}
function toggleService(id,cost){if(state.services.includes(id)){state.services=state.services.filter(x=>x!==id);state.budget+=cost;toast('Serviço retirado.')}else if(state.budget>=cost){state.services.push(id);state.budget-=cost;toast('Tempo comprado.')}else toast('O orçamento não comporta esse gasto.');render()}
function taskPick(){const a=adults();document.getElementById('screen').innerHTML=`<div class="eyebrow">ROTINA · DIA ${state.day}</div><div class="h1">Quem resolve?</div><p class="sub">Cada tarefa precisa de uma única pessoa responsável. Toque numa tarefa para escolher.</p>${taskDefs.map(t=>{const who=state.assign[t[0]];return `<div class="task ${who?'done':''}"><div class="icon">${t[1]}</div><div><b>${t[2]}</b><small>${t[3]}h${who?' · '+esc(who):''}</small></div><button onclick="taskModal('${t[0]}')">${who?'TROCAR':'ESCOLHER'}</button></div>`}).join('')}<button class="btn" onclick="finishTasks()">CONTINUAR →</button>`}
function taskModal(id){const t=taskDefs.find(x=>x[0]===id),a=adults();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="m"><div class="sheet"><div class="eyebrow">ESCOLHA RESPONSÁVEL</div><h2>${t[1]} ${esc(t[2])}</h2><p>${t[3]} horas estimadas na semana.</p><div class="cards"><div class="choice" onclick="pickTask('${id}','${esc(a[0][1])}')"><b>${esc(a[0][1])}</b><small>${a[0][2]}</small></div><div class="choice" onclick="pickTask('${id}','${esc(a[1][1])}')"><b>${esc(a[1][1])}</b><small>${a[1][2]}</small></div></div><button class="btn outline" onclick="document.getElementById('m').remove()">CANCELAR</button></div></div>`) }
function pickTask(id,who){state.assign[id]=who;document.getElementById('m').remove();toast('Responsabilidade definida.');render()}
function finishTasks(){if(Object.keys(state.assign).length<taskDefs.length){toast('Ainda faltam tarefas.');return}go('mentalPick')}
function mentalPick(){const a=adults();document.getElementById('screen').innerHTML=`<div class="eyebrow">ORGANIZAÇÃO INVISÍVEL</div><div class="h1">Quem fica de olho?</div><p class="sub">Algumas coisas exigem lembrar, planejar e acompanhar. Escolha quem assume cada uma.</p>${mentalDefs.map((m,i)=>`<div class="task"><div class="icon">🧠</div><div style="flex:1"><b>${m}</b><small>${state.mental[i]?'Responsável: '+esc(state.mental[i]):'Ainda não definido'}</small></div><button onclick="mentalModal(${i})">${state.mental[i]?'TROCAR':'ESCOLHER'}</button></div>`).join('')}<button class="btn" onclick="finishMental()">FECHAR A ROTINA →</button>`}
function mentalModal(i){const a=adults();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mm"><div class="sheet"><div class="eyebrow">ORGANIZAÇÃO</div><h2>${esc(mentalDefs[i])}</h2><div class="cards"><div class="choice" onclick="pickMental(${i},'${esc(a[0][1])}')"><b>${esc(a[0][1])}</b></div><div class="choice" onclick="pickMental(${i},'${esc(a[1][1])}')"><b>${esc(a[1][1])}</b></div></div><button class="btn outline" onclick="document.getElementById('mm').remove()">CANCELAR</button></div></div>`)}
function pickMental(i,who){state.mental[i]=who;document.getElementById('mm').remove();render()}
function finishMental(){if(Object.keys(state.mental).length<mentalDefs.length){toast('Defina todas as responsabilidades.');return}advanceDay()}
function advanceDay(){state.day++;state.action=0;if(state.day===3)go('eventDay');else if(state.day===4)go('promotion');else if(state.day===6)go('reorg');else if(state.day>=7)go('profile');else go('home')}
function eventDay(){document.getElementById('screen').innerHTML=`<div class="eyebrow">QUARTA · 16:20</div><div class="event"><div class="eventIcon">🚨</div><h2>Um imprevisto apareceu.</h2><p>Uma despesa inesperada de <b>R$ 450</b> precisa ser resolvida. A família precisa escolher como reagir.</p></div>${meters()}<div class="cards"><div class="choice" onclick="shock('reserve')"><b>💳 Pagar com o orçamento</b><small>Absorver o gasto e preservar a divisão atual.</small></div><div class="choice" onclick="shock('cut')"><b>✂️ Reduzir serviços</b><small>Economizar dinheiro e aceitar perder parte do tempo comprado.</small></div><div class="choice" onclick="shock('redistribute')"><b>🔄 Redistribuir a rotina</b><small>Economizar e compensar com mais tarefas da família.</small></div></div>`}
function shock(x){state.shock=x;if(x==='reserve'&&state.budget>=450){state.budget-=450}else if(x==='cut'&&state.services.length){const id=state.services.pop(),s=serviceDefs.find(x=>x[0]===id);state.budget+=s[3];state.mood-=4}else if(x==='redistribute'){state.mood-=7}state.events.push('imprevisto:'+x);go('home')}
function promotion(){const a=adults();const target=(state.group%2===1)?a[0]:a[1];state.promotionTarget=target[1];document.getElementById('screen').innerHTML=`<div class="eyebrow">QUINTA · 09:00</div><div class="event"><div class="eventIcon">🎉</div><h2>Uma promoção mudou a semana.</h2><p><b>${esc(target[1])}</b> recebeu uma nova proposta: <b>+R$ 1.000/mês</b> e <b>+10h de trabalho por semana</b>.</p></div>${meters()}<p class="sub">A renda aumentou, mas o tempo ficou mais apertado. O que a família faz?</p><div class="cards"><div class="choice" onclick="promote('keep')"><b>📌 Manter a divisão</b><small>Não alterar as responsabilidades atuais.</small></div><div class="choice" onclick="promote('other')"><b>🤝 A outra pessoa assume parte</b><small>Transferir parte da rotina para liberar tempo.</small></div><div class="choice" onclick="promote('help')"><b>🛍️ Comprar ajuda</b><small>Usar dinheiro para reduzir a pressão de tempo.</small></div><div class="choice" onclick="promote('rebuild')"><b>🔀 Refazer a divisão</b><small>Reorganizar as tarefas de maneira diferente.</small></div></div>`}
function promote(x){state.promotion=x;if(x==='other')state.mood+=4;if(x==='help'&&state.budget>=300)state.budget-=300;if(x==='keep')state.mood-=8;state.events.push('promocao:'+x);go('home')}
function reorg(){document.getElementById('screen').innerHTML=`<div class="eyebrow">SEXTA · 18:00</div><div class="h1">Última jogada.</div><p class="sub">A família agora tem a renda da promoção. Você decide o destino do novo recurso.</p><div class="budget"><small>NOVO RECURSO MENSAL</small><strong>${money(state.budget+1000)}</strong><small>Antes de decidir, pense no equilíbrio entre dinheiro e tempo.</small></div><div class="cards" style="margin-top:12px"><div class="choice" onclick="finishReorg('time')"><b>⏱️ Comprar mais tempo</b><small>Usar parte do ganho para aliviar a rotina.</small></div><div class="choice" onclick="finishReorg('reserve')"><b>🏦 Guardar</b><small>Priorizar reserva e segurança financeira.</small></div><div class="choice" onclick="finishReorg('house')"><b>🏠 Melhorar a vida da casa</b><small>Direcionar o ganho para consumo e necessidades.</small></div></div>`}
function finishReorg(x){state.reorg=x;state.day=7;go('profile')}
function profile(){document.getElementById('screen').innerHTML=`<div class="eyebrow">DOMINGO · FIM DA SEMANA</div><div class="h1">Antes de sair...</div><p class="sub">Agora algumas informações sobre você. Elas serão usadas somente para comparar os resultados do estudo.</p><div class="field"><label>IDADE</label><input id="age" type="number" min="16" max="99" placeholder="Ex.: 22"></div><div class="field"><label>GÊNERO</label><select id="gender"><option value="">Selecione</option><option>Mulher</option><option>Homem</option><option>Não binário</option><option>Prefiro não responder</option></select></div><div class="field"><label>RENDA MENSAL</label><select id="income"><option value="">Selecione</option><option>Até R$ 2.000</option><option>R$ 2.001–4.000</option><option>R$ 4.001–7.000</option><option>R$ 7.001–12.000</option><option>Acima de R$ 12.000</option><option>Prefiro não responder</option></select></div><div class="field"><label>VOCÊ TEM FILHOS?</label><select id="children"><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Prefiro não responder</option></select></div><button class="btn" onclick="saveProfile()">VER COMO FOI A SEMANA →</button>`}
function saveProfile(){state.profile={age:age.value,gender:gender.value,income:income.value,children:children.value};go('result')}
function hours(who){return taskDefs.reduce((n,t)=>n+(state.assign[t[0]]===who?t[3]:0),0)}
function result(){const a=adults(),ha=hours(a[0][1]),hb=hours(a[1][1]),ma=Object.values(state.mental).filter(x=>x===a[0][1]).length,mb=Object.values(state.mental).filter(x=>x===a[1][1]).length,serviceH=state.services.reduce((n,id)=>n+(serviceDefs.find(s=>s[0]===id)?.[4]||0),0),diff=Math.abs(ha-hb),score=Math.max(0,Math.min(100,100-diff*1.5+serviceH*.25+(state.mood-70)*.25));window.csv=makeCSV();document.getElementById('screen').innerHTML=`<div class="result"><div class="eyebrow">SEMANA CONCLUÍDA</div><div class="score">${Math.round(score)}</div><div class="sub">ÍNDICE DE ORGANIZAÇÃO</div></div><div class="resultBox"><h3>Como a rotina terminou</h3><div class="line"><span>${esc(a[0][1])}</span><b>${ha}h de tarefas</b></div><div class="line"><span>${esc(a[1][1])}</span><b>${hb}h de tarefas</b></div><div class="line"><span>Diferença</span><b>${diff}h</b></div><div class="line"><span>Tempo comprado</span><b>${serviceH}h</b></div></div><div class="resultBox"><h3>Organização</h3><div class="line"><span>${esc(a[0][1])}</span><b>${ma} responsabilidades</b></div><div class="line"><span>${esc(a[1][1])}</span><b>${mb} responsabilidades</b></div><div class="line"><span>Dinheiro restante</span><b>${money(state.budget)}</b></div></div><div class="note">Este resultado descreve as escolhas feitas dentro do jogo. A interpretação econômica e social será feita posteriormente na análise do estudo.</div><button class="btn" onclick="downloadCSV()">BAIXAR DADOS</button><button class="btn light" onclick="location.reload()">JOGAR NOVAMENTE</button>`}
function makeCSV(){const a=adults();const rows=[['id','grupo','familia','adulto_1','idade_adulto_1','genero_adulto_1','adulto_2','idade_adulto_2','genero_adulto_2','servicos','horas_adulto_1','horas_adulto_2','dif_horas','organizacao_adulto_1','organizacao_adulto_2','imprevisto','promocao','alocacao_final','dinheiro_restante','idade_participante','genero_participante','renda','filhos']];rows.push([state.id,state.group,state.family.name,a[0][1],a[0][2],'',a[1][1],a[1][2],'',state.services.join('|'),hours(a[0][1]),hours(a[1][1]),Math.abs(hours(a[0][1])-hours(a[1][1])),Object.values(state.mental).filter(x=>x===a[0][1]).length,Object.values(state.mental).filter(x=>x===a[1][1]).length,state.shock,state.promotion,state.reorg,state.budget,state.profile.age,state.profile.gender,state.profile.income,state.profile.children]);return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n')}
function downloadCSV(){const blob=new Blob([window.csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='24_horas_'+state.id+'.csv';a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
